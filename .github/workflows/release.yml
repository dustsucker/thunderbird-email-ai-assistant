name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(jq -r .version manifest.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != manifest v${V}"; exit 1; }

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Rename zip to xpi
        run: |
          V=$(jq -r .version manifest.json)
          cp "email-assistant-${V}.zip" email-assistant.xpi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: email-assistant.xpi
          draft: true

      - uses: actions/upload-artifact@v4
        with:
          name: email-assistant.xpi
          path: email-assistant.xpi
